{{- $anonymous := b64enc "{\"auths\":{}}" -}}
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
type: kubernetes.io/dockerconfigjson
data:
  # Was hardcoded empty, which rendered as null and made this Secret invalid —
  # every Deployment references it via imagePullSecrets, so the install broke.
  #
  # ghcr.io/sovity/edc-ce and edc-ce-ui are public (verified by an anonymous
  # docker pull), so no token is needed. An empty auths object keeps the Secret
  # valid so the references resolve and the kubelet pulls anonymously.
  #
  # For a private registry, pass a pre-base64-encoded config:
  #   --set ghcrDockerConfigJson="$(echo -n '{"auths":{"ghcr.io":{"username":"U","password":"TOKEN"}}}' | base64 -w0)"
  .dockerconfigjson: {{ .Values.ghcrDockerConfigJson | default $anonymous | quote }}
