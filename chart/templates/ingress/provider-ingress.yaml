apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: provider-ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "ingress.className is required" .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.providerHost is required" .Values.ingress.providerHost | quote }}
      secretName: {{ required "ingress.tls.providerSecretName is required when tls.enabled" .Values.ingress.tls.providerSecretName }}
  {{- end }}
  rules:
  - host: {{ required "ingress.providerHost is required" .Values.ingress.providerHost }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.appName  }}-provider-service
            port:
              number: {{ .Values.service.connector.httpPort }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.appName  }}-provider-ui-service
            port:
              number: {{ .Values.service.providerUi.port }}
