apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  # Was hardcoded empty ("to be added by the user"), which rendered as null and
  # left Postgres with no password. Sourced from values instead, and `required`
  # so a missing value fails the install loudly rather than silently.
  #
  # Must match secrets.connector.sovityJdbcPassword or the consumer connector
  # cannot authenticate against its database.
  POSTGRES_PASSWORD: {{ required "postgres.auth.password is required" .Values.postgres.auth.password | quote }}
