apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName  }}-provider-ui-service
spec:
  type: {{ .Values.service.providerUi.type }}
  selector:
    app: {{ .Values.appName  }}-provider-ui
  ports:
    - port: {{ .Values.service.providerUi.port }}
      targetPort: 8080
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.providerUi.type "NodePort") .Values.service.providerUi.nodePort }}
      nodePort: {{ .Values.service.providerUi.nodePort }}
      {{- end }}
